name: Автоматические тесты Python

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить pytest
        run: python -m pip install -r requirements.txt
      - name: Запустить все 15 тестов
        run: python -m pytest -v
